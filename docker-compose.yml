services:
  fmproject:
    build: .
    image: fmproject:local
    container_name: fmproject
    restart: unless-stopped
    ports:
      - "9400:3000"
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      RUNTIME_DATA_DIR: /app/persistent
    volumes:
      - ./persistent:/app/persistent
