<!doctype html><meta charset="utf-8"><title>Partida ao vivo em 3D: mock</title>
<style>
html,body{margin:0;height:100%;background:#04070d;color:#e8ecf4;font:14px Barlow,system-ui,sans-serif;overflow:hidden}
canvas{display:block}
.hud{position:fixed;left:0;right:0;pointer-events:none;display:flex;justify-content:center}
.top{top:14px}

.min{color:#8b95a8;font-size:16px;min-width:44px;text-align:center}
.bar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(1120px,calc(100% - 32px));background:rgba(7,11,20,.86);border:1px solid #232a3a;border-radius:6px;padding:10px 14px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.grp{white-space:nowrap}
.lab{font:700 13px "Barlow Condensed",system-ui,sans-serif;text-transform:uppercase;letter-spacing:.08em;color:#8b95a8;margin:0 4px 0 8px}
button{font:700 14px "Barlow Condensed",system-ui,sans-serif;text-transform:uppercase;letter-spacing:.08em;background:rgba(11,17,29,.6);color:#8b95a8;border:1px solid #2a3244;border-radius:8px;height:32px;padding:0 12px;cursor:pointer;margin-right:4px}
button:hover{color:#e8ecf4;border-color:#4f86f7}
button.on{border-color:#4f86f7;background:rgba(79,134,247,.15);color:#4f86f7}
.track{position:relative;height:18px}
input[type=range]{position:absolute;inset:0;width:100%;margin:0;accent-color:#4f86f7}
.mark{position:absolute;top:-3px;width:3px;height:8px;background:#f5c542;border-radius:1px;pointer-events:none}
.banner{position:fixed;left:50%;top:72px;transform:translateX(-50%);background:rgba(7,11,20,.92);border:1px solid #4f86f7;border-radius:6px;padding:8px 22px;font:800 28px "Barlow Condensed",system-ui,sans-serif;text-transform:uppercase;display:none;white-space:nowrap}
.replay{position:fixed;left:24px;top:64px;background:#e5484d;color:#fff;border-radius:4px;padding:3px 12px;font:800 20px "Barlow Condensed",system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;display:none}
.skip{position:fixed;right:24px;bottom:130px;display:none}
.fps{position:fixed;right:14px;top:14px;color:#8b95a8;font-variant-numeric:tabular-nums;background:rgba(7,11,20,.7);padding:4px 8px;border-radius:4px}
.name{position:fixed;transform:translate(-50%,-100%);background:rgba(7,11,20,.85);border-left:3px solid #fff;padding:1px 7px;font:600 14px Barlow,system-ui,sans-serif;pointer-events:none;white-space:nowrap;border-radius:2px;display:none}
.err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;font-size:18px}
</style>
<div class="hud top"><div class="score"><span class="kit" id="kitA"></span><span id="nameA"></span><span id="sc"></span><span id="nameB"></span><span class="kit" id="kitB"></span><span class="min" id="min"></span></div></div>

 </div>
</div>

<script>const D=/*DATA*/null;const AUDIO=/*AUDIO*/null;const GRASS="/*GRASS*/";</script>
<script>
(function(){
if(!window.THREE){const e=document.getElementById('err');e.style.display='flex';e.textContent='Sem internet: não consegui carregar a biblioteca 3D.';return}
const L=115,W=74,CX=L/2,CY=W/2,GOAL_MIN=33,GOAL_MAX=41,BAR=2.67,MODEL_H=2.3,PLAYER_H=2.3;

const $=id=>document.getElementById(id);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(30,innerWidth/innerHeight,1,1400);
const orbit=new THREE.OrbitControls(camera,renderer.domElement);orbit.enabled=false;orbit.maxPolarAngle=Math.PI/2.05;orbit.minDistance=8;orbit.maxDistance=300;

// ── Lights ──
const hemi=new THREE.HemisphereLight(0xcfe0ff,0x24402a,.7);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,1);sun.castShadow=true;sun.shadow.mapSize.set(4096,4096);

// ── Pitch ──
const pitchMat=new THREE.MeshStandardMaterial({roughness:.95,metalness:0});
function buildPitch(img){
 const S=20,c=document.createElement('canvas');c.width=(L+16)*S;c.height=(W+16)*S;const g=c.getContext('2d');

 const n=14;for(let i=0;i<n;i++){g.fillStyle=i%2?'rgba(0,0,0,.13)':'rgba(255,255,255,.05)';g.fillRect(i*L/n*S,-8*S,L/n*S,(W+16)*S)}
 // Worn goalmouths and centre spot

 for(const [x,d] of [[0,1],[L,-1]]){
  r(d>0?0:L-18,CY-22,18,44);r(d>0?0:L-6,CY-10,6,20);g.fillStyle='#fff';g.beginPath();g.arc((x+d*12)*S,CY*S,.28*S,0,7);g.fill();
  g.beginPath();const a=Math.acos(6/10);if(d>0)g.arc(12*S,CY*S,10*S,-a,a);else g.arc((L-12)*S,CY*S,10*S,Math.PI-a,Math.PI+a);g.stroke();
 }
 g.fillStyle='#fff';g.beginPath();g.arc(CX*S,CY*S,.28*S,0,7);g.fill();
 for(const [x,y,a0] of [[0,0,0],[L,0,Math.PI/2],[L,W,Math.PI],[0,W,-Math.PI/2]]){g.beginPath();g.arc(x*S,y*S,1*S,a0,a0+Math.PI/2);g.stroke()}
 const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=renderer.capabilities.getMaxAnisotropy();pitchMat.map=t;pitchMat.needsUpdate=true;
}
const grassImg=new Image();grassImg.onload=()=>buildPitch(grassImg);grassImg.src=GRASS;
const ground=new THREE.Mesh(new THREE.PlaneGeometry(L+16,W+16),pitchMat);ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);

const nets={};

 const depth=2.2,cyl=(len,r=.07)=>{const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,10),postMat);m.castShadow=true;return m};
 for(const y of [GOAL_MIN,GOAL_MAX]){const p=cyl(BAR);p.position.set(wx(x),BAR/2,wz(y));scene.add(p)}
 const b=cyl(GOAL_MAX-GOAL_MIN);b.rotation.x=Math.PI/2;b.position.set(wx(x),BAR,0);scene.add(b);
 const pts=[],Bk=-d*depth,Bt=-d*depth*.45,z0=wz(GOAL_MIN),z1=wz(GOAL_MAX),st=.5,seg=(a,c)=>pts.push(a[0],a[1],a[2],c[0],c[1],c[2]);
 for(let z=z0;z<=z1+.01;z+=st){seg([Bt,BAR,z],[Bk,0,z]);seg([0,BAR,z],[Bt,BAR,z])}
 for(let h=0;h<=BAR+.01;h+=st){const f=h/BAR,xx=Bk+(Bt-Bk)*f;seg([xx,h,z0],[xx,h,z1]);seg([0,h,z0],[xx,h,z0]);seg([0,h,z1],[xx,h,z1])}
 for(let i=0;i<=5;i++){const f=i/5;seg([Bt*f,BAR,z0],[Bt*f,BAR,z1]);const xb=Bk*f;seg([xb,0,z0],[xb,BAR*(1-f)+BAR*.0*f,z0]);seg([xb,0,z1],[xb,BAR*(1-f),z1])}

goal(0,1);goal(L,-1);
const flagMat=new THREE.MeshStandardMaterial({color:D.colors.A,side:THREE.DoubleSide});
for(const [x,y] of [[0,0],[L,0],[0,W],[L,W]]){const m=new THREE.Mesh(new THREE.CylinderGeometry(.03,.03,1.7,6),postMat);m.position.set(wx(x),.85,wz(y));m.castShadow=true;scene.add(m);
 const f=new THREE.Mesh(new THREE.PlaneGeometry(.6,.4),flagMat);f.position.set(wx(x)+(x?-.3:.3),1.5,wz(y));scene.add(f)}

// ── Stadium ──
const RUN=9,SETBACK=6,ROWS=26,ROW_D=.95,ROW_H=.62;
const standMat=new THREE.MeshStandardMaterial({color:0x323949,roughness:.9});
const seatMat=new THREE.MeshStandardMaterial({color:new THREE.Color(D.colors.A).multiplyScalar(.42),roughness:.8});
const apron=new THREE.Mesh(new THREE.PlaneGeometry(L+200,W+200),new THREE.MeshStandardMaterial({color:0x07090d,roughness:1}));apron.rotation.x=-Math.PI/2;apron.position.y=-.03;scene.add(apron);
const fans=[];const rnd=(()=>{let s=12345;return()=>(s=(s*1664525+1013904223)>>>0)/4294967296})();

  const m=new THREE.Mesh(new THREE.BoxGeometry(across?ROW_D:len,h,across?len:ROW_D),r%8===7?standMat:seatMat);

 }
 const depth=ROWS*ROW_D,topH=ROW_H*ROWS;

 roof.position.set(cx+dirx*(depth/2),topH+8,cz+dirz*(depth/2));scene.add(roof);
 const back=new THREE.Mesh(new THREE.BoxGeometry(across?1:len+8,topH+8,across?len+8:1),standMat);back.position.set(cx+dirx*(depth+1),(topH+8)/2,cz+dirz*(depth+1));scene.add(back);
 for(let i=-3;i<=3;i++){const col=new THREE.Mesh(new THREE.CylinderGeometry(.22,.22,8,8),standMat);const t=i/3*(len/2-4);col.position.set(cx+dirx*(depth-1)+(across?0:t),topH+4,cz+dirz*(depth-1)+(across?t:0));scene.add(col)}
}
const ex=CX+RUN+SETBACK-3,ez=CY+RUN+SETBACK-3;
stand(0,-ez,L+RUN*2,0,-1,'top');stand(0,ez,L+RUN*2,0,1,'bottom');stand(-ex,0,W+RUN*2,-1,0,'A');stand(ex,0,W+RUN*2,1,0,'B');
const bodies=new THREE.InstancedMesh(new THREE.BoxGeometry(.42,.62,.28),new THREE.MeshLambertMaterial(),fans.length);
const heads=new THREE.InstancedMesh(new THREE.OctahedronGeometry(.16,1),new THREE.MeshLambertMaterial(),fans.length);
const arms=new THREE.InstancedMesh(new THREE.BoxGeometry(.62,.1,.1),new THREE.MeshLambertMaterial(),fans.length);
const skin=[0xf1c9a5,0xd9a57c,0xb98059,0x8a5a3c,0x5c3a26].map(c=>new THREE.Color(c));
const colA=new THREE.Color(D.colors.A),colA2=new THREE.Color(D.colors.A2),colB=new THREE.Color(D.colors.B),plain=[0x20242e,0x3b4252,0xe6e6e6,0x55606f].map(c=>new THREE.Color(c));
const dummy=new THREE.Object3D();
fans.forEach((f,i)=>{const away=f.side==='B'&&rnd()<.82,r=rnd();
 const c=away?(r<.8?colB:plain[0]):(r<.66?colA:r<.7?colA2:plain[Math.floor(rnd()*4)]);
 bodies.setColorAt(i,c);arms.setColorAt(i,c);heads.setColorAt(i,skin[Math.floor(rnd()*5)]);f.away=away});
bodies.instanceColor.needsUpdate=true;heads.instanceColor.needsUpdate=true;arms.instanceColor.needsUpdate=true;
scene.add(bodies,heads,arms);
function updateCrowd(t,jA,jB){
 const anyJump=jA>0||jB>0,step=anyJump?1:4;
 for(let i=Math.floor(t*30)%step;i<fans.length;i+=step){
  const f=fans[i],j=f.away?jB:jA;
  const up=j>0?Math.abs(Math.sin(t*7*f.sp+f.phase))*.55*j:Math.max(0,Math.sin(t*f.sp+f.phase))*.03;
  dummy.position.set(f.x,f.y+.31+up,f.z);dummy.rotation.set(0,0,0);dummy.scale.set(1,1,1);dummy.updateMatrix();bodies.setMatrixAt(i,dummy.matrix);
  dummy.position.y=f.y+.78+up;dummy.updateMatrix();heads.setMatrixAt(i,dummy.matrix);
  const s=j>.05?1:0;dummy.position.y=f.y+1.05+up+Math.sin(t*9+f.phase)*.05;dummy.scale.set(s,s,s);dummy.updateMatrix();arms.setMatrixAt(i,dummy.matrix);
 }
 bodies.instanceMatrix.needsUpdate=true;heads.instanceMatrix.needsUpdate=true;arms.instanceMatrix.needsUpdate=true;
}
updateCrowd(0,1,1);updateCrowd(0,0,0);

// ── Floodlights with an additive glow ──
const glowC=document.createElement('canvas');glowC.width=glowC.height=128;{const g=glowC.getContext('2d'),gr=g.createRadialGradient(64,64,0,64,64,64);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.25,'rgba(220,235,255,.55)');gr.addColorStop(1,'rgba(200,220,255,0)');g.fillStyle=gr;g.fillRect(0,0,128,128)}
const glowT=new THREE.CanvasTexture(glowC);const bulbs=[],glows=[];
for(const [x,z] of [[-1,-1],[1,-1],[-1,1],[1,1]]){
 const tx=x*(CX+SETBACK+RUN+28),tz=z*(CY+SETBACK+RUN+28),h=50;
 const pole=new THREE.Mesh(new THREE.CylinderGeometry(.5,.9,h,8),new THREE.MeshStandardMaterial({color:0x4a5262}));pole.position.set(tx,h/2,tz);scene.add(pole);
 const panel=new THREE.Mesh(new THREE.BoxGeometry(10,6,.6),new THREE.MeshStandardMaterial({color:0x222832,emissive:0xffffff,emissiveIntensity:0}));panel.position.set(tx,h+2,tz);panel.lookAt(0,0,0);scene.add(panel);bulbs.push(panel);
 const gl=new THREE.Sprite(new THREE.SpriteMaterial({map:glowT,color:0xffffff,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,opacity:0}));gl.position.set(tx*.985,h+2,tz*.985);gl.scale.set(46,46,1);scene.add(gl);glows.push(gl);
}

// ── LED boards ──
const ledC=document.createElement('canvas');ledC.width=4096;ledC.height=64;
{const g=ledC.getContext('2d');let x=0,i=0;while(x<4096){const a=D.ads[i++%D.ads.length],w=340;g.fillStyle=a.bg;g.fillRect(x,0,w,64);g.fillStyle=a.fg;g.font='700 34px "Barlow Condensed",Arial';g.textAlign='center';g.textBaseline='middle';g.fillText(a.text,x+w/2,33);x+=w}}
const ledT=new THREE.CanvasTexture(ledC);ledT.wrapS=THREE.RepeatWrapping;ledT.encoding=THREE.sRGBEncoding;const ledTs=[];
function led(x,z,len,ry){const t=ledT.clone();t.needsUpdate=true;t.repeat.x=len/70;ledTs.push(t);
 const b=new THREE.Mesh(new THREE.PlaneGeometry(len,.95),new THREE.MeshBasicMaterial({map:t,toneMapped:false}));b.position.set(x,.5,z);b.rotation.y=ry;scene.add(b);
 const k=new THREE.Mesh(new THREE.BoxGeometry(ry?.2:len,.95,ry?len:.2),new THREE.MeshStandardMaterial({color:0x101319}));k.position.set(x+(ry?(x<0?-.12:.12):0),.5,z+(ry?0:(z<0?-.12:.12)));scene.add(k)}
led(0,-(CY+6),L+6,0);led(-(CX+6),-20,30,Math.PI/2);led(-(CX+6),20,30,Math.PI/2);led(CX+6,-20,30,-Math.PI/2);led(CX+6,20,30,-Math.PI/2);
for(const x of [-16,16]){const b=new THREE.Mesh(new THREE.BoxGeometry(11,1.4,1.5),new THREE.MeshStandardMaterial({color:0x2d3442,transparent:true,opacity:.75}));b.position.set(x,.7,CY+6.2);b.castShadow=true;scene.add(b)}

// ── Figures: jointed, one skeleton for players and officials ──
const SK=[0xf1c9a5,0xe0b48c,0xc58f66,0x9a6a48,0x6b4530],HAIR=[0x1c130c,0x3a2414,0x6b4423,0xa9792f,0x0d0d0d,0xc9b98a];
const faceTex=SK.map(c=>{const cv=document.createElement('canvas');cv.width=128;cv.height=64;const g=cv.getContext('2d');g.fillStyle='#'+c.toString(16).padStart(6,'0');g.fillRect(0,0,128,64);
 // The sphere's front (+z) maps to u = .25
 g.fillStyle='#14100c';g.fillRect(26,27,4,3);g.fillRect(36,27,4,3);g.fillStyle='rgba(60,30,20,.55)';g.fillRect(29,40,8,2);
 const t=new THREE.CanvasTexture(cv);t.encoding=THREE.sRGBEncoding;return t});
const std=(c,r=.75)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
const G={thigh:new THREE.CylinderGeometry(.115,.09,.5,8).translate(0,-.25,0),shin:new THREE.CylinderGeometry(.085,.06,.48,8).translate(0,-.24,0),boot:new THREE.BoxGeometry(.14,.09,.32).translate(0,-.045,.07),
 up:new THREE.CylinderGeometry(.075,.062,.36,7).translate(0,-.18,0),low:new THREE.CylinderGeometry(.058,.045,.34,7).translate(0,-.17,0),hand:new THREE.SphereGeometry(.058,7,6),
 torso:new THREE.CylinderGeometry(.285,.22,.68,12),short:new THREE.CylinderGeometry(.235,.27,.3,10),neck:new THREE.CylinderGeometry(.065,.075,.11,8),head:new THREE.SphereGeometry(.165,16,12),
 hair0:new THREE.SphereGeometry(.172,14,8,0,6.3,0,1.45),hair1:new THREE.SphereGeometry(.2,12,8,0,6.3,0,1.7),hair2:new THREE.SphereGeometry(.168,14,8,0,6.3,0,1.2),
 blob:new THREE.CircleGeometry(.55,20)};
const blobC=document.createElement('canvas');blobC.width=blobC.height=64;{const g=blobC.getContext('2d'),gr=g.createRadialGradient(32,32,2,32,32,32);gr.addColorStop(0,'rgba(0,0,0,.55)');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(0,0,64,64)}
const blobM=new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(blobC),transparent:true,depthWrite:false});
const numTex=(n,col)=>{const c=document.createElement('canvas');c.width=c.height=96;const g=c.getContext('2d');g.fillStyle=col;g.font='800 70px "Barlow Condensed",Arial';g.textAlign='center';g.textBaseline='middle';g.fillText(String(n),48,52);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;return t};
function makeFigure(o){
 const sc=o.scale||1,root=new THREE.Group(),body=new THREE.Group();root.add(body);root.scale.setScalar(sc*PLAYER_H/MODEL_H);
 const mesh=(geo,mat,parent,x=0,y=0,z=0,sh=true)=>{const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.castShadow=sh;parent.add(m);return m};
 const shirt=std(o.shirt),shorts=std(o.shorts),socks=std(o.socks),skinM=std(o.skinColor),boots=std(o.boot||0x111111,.5),hairM=std(o.hair);
 const hips=new THREE.Group();hips.position.y=1.0;body.add(hips);
 mesh(G.short,shorts,hips,0,.02,0).scale.z=.72;
 const spine=new THREE.Group();spine.position.y=.14;hips.add(spine);
